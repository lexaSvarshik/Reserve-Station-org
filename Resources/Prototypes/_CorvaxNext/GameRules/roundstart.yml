- type: entity
  id: BattleRoyale
  name: Battle Royale
  parent: BaseGameRule
  components:
  - type: BattleRoyaleRule
    roundEndDelay: 10
  - type: LoadMapRule
    mapPath: /Maps/_CorvaxNext/battleroyale.yml
  - type: RuleGrids
  - type: PointManager
  - type: GameRule
    minPlayers: 1
  - type: AntagLoadProfileRule
    speciesOverride: Human
    speciesOverrideBlacklist:
    - Yowie
    - Oni
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ BattleRoyaleMember ]
      spawnerPrototype: SpawnPointBattleRoyale
      startingGear: BattleRoyaleGear
      roleLoadout:
      - RoleSurvivalNukie
      briefing:
        text: battleroyale-briefing
        sound: "/Audio/_CorvaxNext/Misc/vox_raiders_greeting.ogg"
      mindRoles:
      - MindRoleBattleRoyaleMember
      components:
        - type: KillTracker
